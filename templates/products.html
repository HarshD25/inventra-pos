<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventra POS - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-gray-100 font-sans text-gray-800 flex flex-col md:flex-row min-h-screen relative"
  >
    <!-- Toast Notification Container -->
    <div
      id="toast"
      class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium"
    >
      <i id="toast-icon" class="fa-solid"></i>
      <span id="toast-message">Notification message</span>
    </div>

    <!-- Mobile Navigation Header -->
    <div
      class="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center z-40"
    >
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-boxes-stacked text-xl"></i>
        <span class="font-bold tracking-wide">Inventra POS</span>
      </div>
      <button
        onclick="toggleMobileMenu()"
        class="text-gray-300 hover:text-white focus:outline-none"
      >
        <i class="fa-solid fa-bars text-xl"></i>
      </button>
    </div>

    <aside
      id="sidebar"
      class="hidden md:flex w-full md:w-56 bg-slate-900 text-slate-300 flex-col flex-shrink-0"
    >
      <div
        class="p-4 hidden md:flex items-center gap-3 border-b border-slate-800"
      >
        <i class="fa-solid fa-boxes-stacked text-xl text-white"></i>
        <span class="font-bold text-white tracking-wide">Inventra POS</span>
      </div>
      <nav class="flex-1 py-4 space-y-1">
        <a
          href="/dashboard.html"
          class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium transition hover:bg-slate-800"
        >
          <i class="fa-solid fa-house w-4"></i> Dashboard
        </a>
        <a
          href="/products.html"
          class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium bg-slate-800 text-white"
        >
          <i class="fa-solid fa-box-open w-4"></i> Products
        </a>
        <a
          href="/sales.html"
          class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium transition hover:bg-slate-800"
        >
          <i class="fa-solid fa-calculator w-4"></i> POS Terminal
        </a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header
        class="bg-white border-b px-4 sm:px-6 py-3 flex justify-between items-center"
      >
        <h2 class="text-lg sm:text-xl font-bold text-slate-800">
          Product Inventory
        </h2>
        <div
          class="flex items-center gap-3 sm:gap-4 text-xs sm:text-sm text-gray-600"
        >
          <span
            >Welcome, <b id="user-display" class="text-slate-800">User</b></span
          >
          <button
            onclick="logout()"
            class="text-red-600 hover:text-red-800 text-xs font-semibold"
          >
            Logout
          </button>
        </div>
      </header>

      <main class="flex-1 p-4 sm:p-6 space-y-6">
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="font-bold text-gray-800 text-sm mb-3">
            Add New Inventory Item
          </h3>
          <form
            id="add-product-form"
            onsubmit="createProduct(event)"
            class="flex flex-col sm:grid sm:grid-cols-2 md:grid-cols-5 gap-3"
          >
            <input
              id="prod-name"
              type="text"
              placeholder="Product Name"
              required
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              id="prod-price"
              type="number"
              step="0.01"
              min="0.01"
              placeholder="Price ($)"
              required
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              id="prod-stock"
              type="number"
              min="0"
              placeholder="Initial Stock"
              required
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <select
              id="prod-icon"
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="box">Default Box</option>
              <option value="laptop">Laptop</option>
              <option value="tv">TV / Display</option>
              <option value="mobile-screen">Phone / iPhone</option>
              <option value="keyboard">Keyboard</option>
              <option value="plug">Cable / Charger</option>
              <option value="headphones">Headphones</option>
              <option value="computer-mouse">Mouse</option>
            </select>
            <button
              type="submit"
              class="bg-emerald-600 text-white rounded text-sm font-medium py-1.5 hover:bg-emerald-700 transition sm:col-span-2 md:col-span-1"
            >
              Add Product
            </button>
          </form>
        </div>

        <div class="flex flex-col md:flex-row gap-6">
          <div
            class="w-full md:w-64 bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-4 h-fit"
          >
            <h3 class="font-bold text-gray-800 border-b pb-2 text-sm">
              Filters & Search
            </h3>
            <div>
              <label class="text-xs font-semibold text-gray-600"
                >Search Product</label
              >
              <div class="relative mt-1">
                <i
                  class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"
                ></i>
                <input
                  type="text"
                  id="inventory-search"
                  oninput="renderInventory()"
                  placeholder="Type to search..."
                  class="w-full pl-8 pr-3 py-1.5 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-600"
                >Stock Status Filter</label
              >
              <select
                id="inventory-filter"
                onchange="renderInventory()"
                class="mt-1 w-full border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="all">All Items</option>
                <option value="in_stock">In Stock (>=10)</option>
                <option value="low_stock">Low Stock (1-9)</option>
                <option value="out_of_stock">Out of Stock (0)</option>
              </select>
            </div>
          </div>

          <div
            class="flex-1 bg-white rounded-xl border border-gray-200 shadow-sm p-4 overflow-x-auto"
          >
            <table class="w-full min-w-[600px] text-left text-sm">
              <thead>
                <tr class="border-b text-gray-500 font-medium">
                  <th class="pb-3 pl-2">Icon</th>
                  <th class="pb-3">Name</th>
                  <th class="pb-3">Price</th>
                  <th class="pb-3">Stock Quantity</th>
                  <th class="pb-3">Status</th>
                  <th class="pb-3 text-right pr-2">Actions</th>
                </tr>
              </thead>
              <tbody
                id="inventory-table-body"
                class="divide-y divide-gray-100"
              ></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Custom Tailwind Delete Confirmation Modal -->
    <div
      id="delete-modal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl border border-gray-100 space-y-4"
      >
        <div class="flex items-center gap-3 text-red-600">
          <div
            class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center shrink-0"
          >
            <i class="fa-solid fa-triangle-exclamation text-lg"></i>
          </div>
          <h3 class="font-bold text-gray-900 text-base">Delete Product</h3>
        </div>

        <p class="text-xs text-gray-600 leading-relaxed">
          Are you sure you want to delete this product? This action cannot be
          undone.
        </p>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button
            onclick="closeDeleteModal()"
            class="px-3.5 py-1.5 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg transition"
          >
            Cancel
          </button>
          <button
            id="confirm-delete-btn"
            class="px-3.5 py-1.5 text-xs font-semibold bg-red-600 hover:bg-red-700 text-white rounded-lg transition shadow-sm"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script>
      let products = [];

      function toggleMobileMenu() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("hidden");
      }

      function showToast(message, type = "success") {
        const toast = document.getElementById("toast");
        const msg = document.getElementById("toast-message");
        const icon = document.getElementById("toast-icon");

        if (!toast || !msg || !icon) return;

        msg.innerText = message;
        if (type === "success") {
          toast.className =
            "fixed bottom-5 right-5 z-50 transition-all duration-300 flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium bg-emerald-600 translate-y-0 opacity-100";
          icon.className = "fa-solid fa-circle-check";
        } else {
          toast.className =
            "fixed bottom-5 right-5 z-50 transition-all duration-300 flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium bg-red-600 translate-y-0 opacity-100";
          icon.className = "fa-solid fa-circle-exclamation";
        }

        setTimeout(() => {
          toast.classList.add("translate-y-20", "opacity-0");
        }, 3000);
      }

      async function loadProducts() {
        try {
          const res = await fetch("/api/products");
          if (res.status === 401) return (window.location.href = "/login.html");
          if (!res.ok) throw new Error("Failed to fetch products");

          const data = await res.json();
          const rawProducts = Array.isArray(data) ? data : data.products || [];

          // Merge duplicate products that share the exact same Name and Price
          const mergedMap = new Map();

          rawProducts.forEach((p) => {
            const key = `${(p.name || "").toLowerCase().trim()}_${Number(p.price || 0).toFixed(2)}`;

            if (mergedMap.has(key)) {
              const existing = mergedMap.get(key);
              existing.stock += Number(p.stock || 0);
            } else {
              mergedMap.set(key, {
                ...p,
                price: Number(p.price || 0),
                stock: Number(p.stock || 0),
              });
            }
          });

          products = Array.from(mergedMap.values());
          renderInventory();
        } catch (err) {
          console.error("Failed to load products:", err);
          showToast("Failed to load inventory", "error");
        }
      }

      function getStockBadge(stock) {
        if (stock === 0) {
          return `<span class="px-2 py-0.5 text-[11px] font-semibold bg-red-100 text-red-700 rounded-full">Out of Stock</span>`;
        } else if (stock < 10) {
          return `<span class="px-2 py-0.5 text-[11px] font-semibold bg-amber-100 text-amber-700 rounded-full">Low Stock</span>`;
        }
        return `<span class="px-2 py-0.5 text-[11px] font-semibold bg-emerald-100 text-emerald-700 rounded-full">In Stock</span>`;
      }

      function renderInventory() {
        const searchInput = document.getElementById("inventory-search");
        const filterInput = document.getElementById("inventory-filter");
        const tbody = document.getElementById("inventory-table-body");

        if (!tbody) return;

        const query = searchInput ? searchInput.value.toLowerCase().trim() : "";
        const filter = filterInput ? filterInput.value : "all";
        tbody.innerHTML = "";

        const filtered = products.filter((p) => {
          const matchesQuery = p.name
            ? p.name.toLowerCase().includes(query)
            : false;
          let matchesFilter = true;

          if (filter === "in_stock") matchesFilter = p.stock >= 10;
          else if (filter === "low_stock")
            matchesFilter = p.stock > 0 && p.stock < 10;
          else if (filter === "out_of_stock") matchesFilter = p.stock === 0;

          return matchesQuery && matchesFilter;
        });

        if (!filtered.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400 text-xs">No matching products found.</td></tr>`;
          return;
        }

        filtered.forEach((p) => {
          const rawIcon = getAutoIcon(p.name, p.icon);
          const finalIconClass = normalizeIcon(rawIcon);
          const badge = getStockBadge(p.stock);

          const priceVal =
            typeof p.price === "number"
              ? p.price.toFixed(2)
              : parseFloat(p.price || 0).toFixed(2);

          tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition border-b border-gray-100">
            <td class="py-3 pl-2"><i class="${finalIconClass} text-gray-500"></i></td>
            <td class="font-medium text-gray-900 capitalize">${p.name}</td>
            <td class="font-semibold text-gray-700">$${priceVal}</td>
            <td class="text-gray-600">${p.stock} units</td>
            <td>${badge}</td>
            <td class="py-3 pr-2 text-right">
              <button 
                onclick="deleteProduct('${p.id || p._id}')" 
                class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded transition"
                title="Delete Product"
              >
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>`;
        });
      }

      async function createProduct(e) {
        e.preventDefault();

        const payload = {
          name: document.getElementById("prod-name").value.trim(),
          price: parseFloat(document.getElementById("prod-price").value),
          stock: parseInt(document.getElementById("prod-stock").value, 10),
          icon: document.getElementById("prod-icon").value,
        };

        try {
          const res = await fetch("/api/products", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await res.json();
          if (res.ok) {
            showToast("Product added successfully!", "success");
            document.getElementById("add-product-form").reset();
            loadProducts();
          } else {
            showToast(data.error || "Failed to create product", "error");
          }
        } catch (err) {
          showToast("Network error while creating product", "error");
        }
      }

      let pendingDeleteId = null;

      function deleteProduct(productId) {
        if (!productId || productId === "undefined") {
          showToast("Cannot delete item without a valid ID", "error");
          return;
        }

        pendingDeleteId = productId;
        document.getElementById("delete-modal").classList.remove("hidden");
      }

      function closeDeleteModal() {
        pendingDeleteId = null;
        document.getElementById("delete-modal").classList.add("hidden");
      }

      document
        .getElementById("confirm-delete-btn")
        .addEventListener("click", async () => {
          if (!pendingDeleteId) return;
          const productId = pendingDeleteId;
          closeDeleteModal();

          try {
            const res = await fetch(`/api/products/${productId}`, {
              method: "DELETE",
            });

            if (res.ok) {
              showToast("Product deleted successfully!", "success");
              loadProducts();
            } else {
              let errorMsg = "Failed to delete product";
              const contentType = res.headers.get("content-type");
              if (contentType && contentType.includes("application/json")) {
                const data = await res.json();
                errorMsg = data.error || errorMsg;
              }
              showToast(errorMsg, "error");
            }
          } catch (err) {
            console.error("Delete error:", err);
            showToast("Network error while deleting product", "error");
          }
        });

      function getAutoIcon(name, customIcon = "") {
        if (customIcon && customIcon !== "fa-box" && customIcon !== "box") {
          return customIcon;
        }

        const cleanName = (name || "").toLowerCase().trim();

        const mappings = [
          {
            keywords: ["laptop", "macbook", "notebook", "pc"],
            icon: "fa-laptop",
          },
          {
            keywords: [
              "phone",
              "iphone",
              "mobile",
              "samsung",
              "pixel",
              "smartphone",
            ],
            icon: "fa-mobile-screen",
          },
          {
            keywords: ["tv", "television", "display", "monitor", "screen"],
            icon: "fa-tv",
          },
          { keywords: ["mouse", "trackpad"], icon: "fa-computer-mouse" },
          {
            keywords: ["usb", "cable", "charger", "plug", "adapter"],
            icon: "fa-plug",
          },
          {
            keywords: ["headphone", "headset", "earphone", "airpods", "audio"],
            icon: "fa-headphones",
          },
          { keywords: ["keyboard", "keypad"], icon: "fa-keyboard" },
          {
            keywords: ["watch", "smartwatch", "apple watch"],
            icon: "fa-stopwatch",
          },
          { keywords: ["camera", "cam", "webcam"], icon: "fa-camera" },
          { keywords: ["print", "printer", "scanner"], icon: "fa-print" },
          {
            keywords: ["speaker", "soundbar", "subwoofer"],
            icon: "fa-volume-high",
          },
          {
            keywords: ["game", "ps5", "xbox", "controller", "nintendo"],
            icon: "fa-gamepad",
          },
          {
            keywords: ["shirt", "tshirt", "apparel", "clothing"],
            icon: "fa-shirt",
          },
          { keywords: ["book", "notebook", "journal"], icon: "fa-book" },
          { keywords: ["coffee", "drink", "cup", "mug"], icon: "fa-mug-hot" },
        ];

        for (const rule of mappings) {
          if (rule.keywords.some((key) => cleanName.includes(key))) {
            return rule.icon;
          }
        }

        return "fa-box";
      }

      function normalizeIcon(icon) {
        let raw = (icon || "fa-box").trim();
        if (raw === "fa-mouse") raw = "fa-computer-mouse";
        raw = raw.replace(/^fa-solid\s+/, "").replace(/^fa-/, "");
        return `fa-solid fa-${raw}`;
      }

      async function logout() {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/login.html";
      }

      document.addEventListener("DOMContentLoaded", loadProducts);
    </script>
  </body>
</html>
