<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inventra POS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div
      class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-100 text-center"
    >
      <div
        class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-slate-900 text-white text-2xl mb-4"
      >
        <i class="fa-solid fa-boxes-stacked"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Inventra POS</h1>
      <p class="text-xs text-gray-500 mb-6">
        Default Admin Credentials: <b>admin</b> / <b>admin123</b>
      </p>

      <div
        id="error-msg"
        class="hidden mb-4 p-2 bg-red-100 border border-red-300 text-red-700 text-xs rounded"
      ></div>

      <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Username</label
          >
          <div class="relative">
            <i
              class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>
            <input
              id="username"
              type="text"
              required
              class="w-full pl-9 pr-4 py-2 bg-blue-50/50 border border-blue-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Password</label
          >
          <div class="relative">
            <i
              class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>
            <input
              id="password"
              type="password"
              required
              class="w-full pl-9 pr-4 py-2 bg-blue-50/50 border border-blue-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>
        <button
          type="submit"
          class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm hover:bg-slate-800 transition"
        >
          Sign In
        </button>
      </form>
    </div>

    <script>
      async function handleLogin(e) {
        e.preventDefault();
        const errorDiv = document.getElementById("error-msg");
        const submitBtn = e.target.querySelector("button[type='submit']");

        errorDiv.classList.add("hidden");
        submitBtn.disabled = true;
        submitBtn.innerText = "Signing in...";

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value,
            }),
          });

          const data = await res.json();

          if (res.ok) {
            window.location.href = "/dashboard.html";
          } else {
            errorDiv.innerText = data.error || "Invalid username or password";
            errorDiv.classList.remove("hidden");
          }
        } catch (err) {
          errorDiv.innerText = "Server error. Please try again later.";
          errorDiv.classList.remove("hidden");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "Sign In";
        }
      }
    </script>
  </body>
</html>
