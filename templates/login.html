<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventra POS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 7l8 4v10l-8 4-8-4V11z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-100 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white text-2xl mb-4 shadow">
        <i class="fa-solid fa-cube"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Inventra<span class="font-light text-slate-400"> POS</span></h1>
      <p class="text-xs text-gray-400 mb-3">Inventory &amp; point-of-sale</p>
      {% if demo %}
      <div class="text-xs text-gray-500 mb-6 space-y-1">
        <p>Demo accounts (click to fill):</p>
        <p>
          <button type="button" onclick="fill('admin','admin123')" class="px-2 py-1 bg-slate-100 rounded hover:bg-slate-200"><b>admin</b> / admin123</button>
          <button type="button" onclick="fill('cashier','cashier123')" class="px-2 py-1 bg-slate-100 rounded hover:bg-slate-200"><b>cashier</b> / cashier123</button>
        </p>
      </div>
      {% else %}<div class="mb-6"></div>{% endif %}

      <div id="error-msg" class="hidden mb-4 p-2 bg-red-100 border border-red-300 text-red-700 text-xs rounded"></div>

      <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
        <div>
          <label for="username" class="block text-xs font-semibold text-gray-600 mb-1">Username</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="username" type="text" required autocomplete="username" autocapitalize="none" autofocus
              class="w-full pl-9 pr-4 py-2 bg-blue-50/50 border border-blue-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>
        <div>
          <label for="password" class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="password" type="password" required autocomplete="current-password"
              class="w-full pl-9 pr-10 py-2 bg-blue-50/50 border border-blue-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
              <i id="toggle-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm hover:bg-slate-800 transition">Sign In</button>
      </form>
    </div>

    <script>
      function fill(u, p) { document.getElementById("username").value = u; document.getElementById("password").value = p; }
      function togglePassword() {
        const pwd = document.getElementById("password"), icon = document.getElementById("toggle-icon");
        const show = pwd.type === "password";
        pwd.type = show ? "text" : "password";
        icon.className = show ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
      }
      async function handleLogin(e) {
        e.preventDefault();
        const errorDiv = document.getElementById("error-msg");
        const btn = e.target.querySelector("button[type='submit']");
        errorDiv.classList.add("hidden");
        btn.disabled = true; btn.textContent = "Signing in...";
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" },
            body: JSON.stringify({ username: document.getElementById("username").value.trim(), password: document.getElementById("password").value }),
          });
          const data = await res.json();
          if (res.ok) { window.location.href = "/"; return; }
          errorDiv.textContent = data.error || "Invalid username or password";
        } catch (err) {
          errorDiv.textContent = "Server error. Please try again later.";
        }
        errorDiv.classList.remove("hidden");
        btn.disabled = false; btn.textContent = "Sign In";
      }
    </script>
  </body>
</html>
