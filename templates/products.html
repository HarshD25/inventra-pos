<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inventra POS - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 font-sans text-gray-800 flex min-h-screen">
    <aside class="w-56 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0">
      <div class="p-4 flex items-center gap-3 border-b border-slate-800">
        <i class="fa-solid fa-boxes-stacked text-xl text-white"></i>
        <span class="font-bold text-white tracking-wide">Inventra POS</span>
      </div>
      <nav class="flex-1 py-4 space-y-1">
        <a
          href="/dashboard.html"
          class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium transition hover:bg-slate-800"
        >
          <i class="fa-solid fa-house w-4"></i> Dashboard
        </a>
        <a
          href="/products.html"
          class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium bg-slate-800 text-white"
        >
          <i class="fa-solid fa-box-open w-4"></i> Products
        </a>
        <a
          href="/sales.html"
          class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium transition hover:bg-slate-800"
        >
          <i class="fa-solid fa-calculator w-4"></i> POS Terminal
        </a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header
        class="bg-white border-b px-6 py-3 flex justify-between items-center"
      >
        <h2 class="text-xl font-bold text-slate-800">Product Inventory</h2>
        <div class="flex items-center gap-4 text-sm text-gray-600">
          <span>Welcome, <b class="text-slate-800">({{ user }})</b></span>
          <button
            onclick="logout()"
            class="text-red-600 hover:text-red-800 text-xs font-semibold"
          >
            Logout
          </button>
        </div>
      </header>

      <main class="flex-1 p-6 space-y-6">
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="font-bold text-gray-800 text-sm mb-3">
            Add New Inventory Item
          </h3>
          <form
            onsubmit="createProduct(event)"
            class="grid grid-cols-1 md:grid-cols-5 gap-3"
          >
            <input
              id="prod-name"
              type="text"
              placeholder="Product Name"
              required
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              id="prod-price"
              type="number"
              step="0.01"
              min="0.01"
              placeholder="Price ($)"
              required
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              id="prod-stock"
              type="number"
              min="0"
              placeholder="Initial Stock"
              required
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <select
              id="prod-icon"
              class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="fa-box">Default Box</option>
              <option value="fa-laptop">Laptop</option>
              <option value="fa-keyboard">Keyboard</option>
              <option value="fa-plug">USB/Cable</option>
              <option value="fa-mobile-screen">Phone</option>
              <option value="fa-headphones">Headphones</option>
              <option value="fa-mouse">Mouse</option>
            </select>
            <button
              type="submit"
              class="bg-emerald-600 text-white rounded text-sm font-medium py-1.5 hover:bg-emerald-700 transition"
            >
              Add Product
            </button>
          </form>
        </div>

        <div class="flex flex-col md:flex-row gap-6">
          <div
            class="w-full md:w-64 bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-4 h-fit"
          >
            <h3 class="font-bold text-gray-800 border-b pb-2 text-sm">
              Filters & Search
            </h3>
            <div>
              <label class="text-xs font-semibold text-gray-600"
                >Search Product</label
              >
              <div class="relative mt-1">
                <i
                  class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"
                ></i>
                <input
                  type="text"
                  id="inventory-search"
                  oninput="renderInventory()"
                  placeholder="Type to search..."
                  class="w-full pl-8 pr-3 py-1.5 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-600"
                >Stock Status Filter</label
              >
              <select
                id="inventory-filter"
                onchange="renderInventory()"
                class="mt-1 w-full border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="all">All Items</option>
                <option value="in_stock">In Stock (>10)</option>
                <option value="low_stock">Low Stock (1-9)</option>
                <option value="out_of_stock">Out of Stock (0)</option>
              </select>
            </div>
          </div>

          <div
            class="flex-1 bg-white rounded-xl border border-gray-200 shadow-sm p-4 overflow-x-auto"
          >
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="border-b text-gray-500 font-medium">
                  <th class="pb-3 pl-2">Icon</th>
                  <th class="pb-3">Name</th>
                  <th class="pb-3">Price</th>
                  <th class="pb-3">Stock Quantity</th>
                  <th class="pb-3">Status</th>
                </tr>
              </thead>
              <tbody
                id="inventory-table-body"
                class="divide-y divide-gray-100"
              ></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script>
      let products = [];

      async function loadProducts() {
        const res = await fetch("/api/products");
        if (res.status === 401) return (window.location.href = "/login.html");
        products = await res.json();
        renderInventory();
      }

      function renderInventory() {
        const query = document
          .getElementById("inventory-search")
          .value.toLowerCase().strip
          ? document
              .getElementById("inventory-search")
              .value.toLowerCase()
              .strip()
          : document.getElementById("inventory-search").value.toLowerCase();
        const filter = document.getElementById("inventory-filter").value;
        const tbody = document.getElementById("inventory-table-body");
        tbody.innerHTML = "";

        const filtered = products.filter((p) => {
          const matchesQuery = p.name.toLowerCase().includes(query);
          let matchesFilter = true;

          if (filter === "in_stock") matchesFilter = p.stock >= 10;
          else if (filter === "low_stock")
            matchesFilter = p.stock > 0 && p.stock < 10;
          else if (filter === "out_of_stock") matchesFilter = p.stock === 0;

          return matchesQuery && matchesFilter;
        });

        if (!filtered.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-400 text-xs">No matching products found.</td></tr>`;
          return;
        }

        filtered.forEach((p) => {
          let badge =
            '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">In Stock</span>';
          if (p.stock === 0) {
            badge =
              '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700">Out of Stock</span>';
          } else if (p.stock < 10) {
            badge =
              '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-700">Low Stock</span>';
          }

          tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="py-3 pl-2"><i class="fa-solid ${p.icon} text-gray-500"></i></td>
            <td class="font-medium text-gray-900">${p.name}</td>
            <td class="font-semibold text-gray-700">$${p.price.toFixed(2)}</td>
            <td>${p.stock} units</td>
            <td>${badge}</td>
          </tr>`;
        });
      }

      async function createProduct(e) {
        e.preventDefault();
        const payload = {
          name: document.getElementById("prod-name").value,
          price: document.getElementById("prod-price").value,
          stock: document.getElementById("prod-stock").value,
          icon: document.getElementById("prod-icon").value,
        };

        const res = await fetch("/api/products", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (res.ok) {
          e.target.reset();
          loadProducts();
        } else {
          alert(data.error || "Failed to create product");
        }
      }

      async function logout() {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/login.html";
      }

      loadProducts();
    </script>
  </body>
</html>
